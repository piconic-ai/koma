name: tagpr

# main が進むたびに tagpr がリリースPR（package.json のバージョンbump +
# CHANGELOG更新）を自動で用意・追従させる。このPRのマージがタグを打つ。
#
# デプロイは Cloudflare Workers Builds（Cloudflare 側の Git 連携。Production
# branch = release）に任せている。Workers Builds は「push トリガー」しか
# 持たずタグ限定デプロイができないので、release ブランチをタグが打たれた
# 時だけ GitHub API（GITHUB_TOKEN）で進める（このリポジトリへの操作だけなので
# 追加のシークレットは不要）。通常の main push（リリースPRの追従更新のみ）では
# タグが出ないので release は動かず、デプロイも走らない。
#
# git push ではなく GitHub API（PATCH .../git/refs/heads/release,
# force=false）で進める: チェックアウトを一切せずサーバー側に
# fast-forward 判定をさせるので、ローカルの浅いcloneが持っていない過去の
# コミットのせいで正当な push が「fetch first」で拒否される問題が起きず、
# かつ非fast-forwardなら force=false のおかげでちゃんと弾かれる（force
# push で安全弁を失うことも、fetch-depth: 0 でリポジトリが育つほど重く
# なることもない）。

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: release-tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  advance-release-branch:
    name: Advance release branch
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tagpr.outputs.tag }}
    steps:
      - name: Advance release to this tag (fast-forward only, no checkout needed)
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" \
              -f sha="$sha" -F force=false
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/release -f sha="$sha"
          fi
